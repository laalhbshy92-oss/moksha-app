name: Build Moksha APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - name: Fix project structure
        run: |
          mv lib/main.dart /tmp/main.dart.bak
          mv pubspec.yaml /tmp/pubspec.yaml.bak
          flutter create . --project-name moksha_app --platforms=android
          mv /tmp/main.dart.bak lib/main.dart
          mv /tmp/pubspec.yaml.bak pubspec.yaml
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: moksha-apk
          path: build/app/outputs/flutter-apk/app-release.apk
